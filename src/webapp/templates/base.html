<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Password Manager{% endblock %}</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161922;
    --panel-2: #1e222d;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #5eead4;
    --accent-2: #38bdf8;
    --danger: #f87171;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header h1 span { color: var(--accent); }
  .dbpath {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .card + .card { margin-top: 20px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input[type="file"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent-2); }
  button {
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button.danger { background: var(--danger); color: #1a0e0e; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row button { margin-top: 0; }
  .error {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error ul { margin: 6px 0 0 18px; padding: 0; }
  .entry {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .entry-name { font-weight: 600; font-size: 15px; }
  .entry-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    word-break: break-all;
    line-height: 1.5;
  }
  .entry-plain {
    font-family: var(--mono);
    background: rgba(94, 234, 212, 0.08);
    border: 1px solid rgba(94, 234, 212, 0.25);
    color: var(--accent);
    padding: 8px 10px;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 14px;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
  form.inline { display: inline; }
  .logout-form { margin: 0; }
  .top-actions button { margin-top: 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  code {
    font-family: var(--mono);
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  .secondary-link {
    color: var(--accent-2);
    font-size: 13px;
    text-decoration: none;
  }
  .secondary-link:hover { text-decoration: underline; }
  .btn-like {
    display: inline-flex;
    align-items: center;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    text-decoration: none;
    color: var(--muted);
  }
  .btn-like:hover { color: var(--text); border-color: var(--accent-2); }
  .candidate-option {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    cursor: pointer;
  }
  .candidate-option input[type="radio"] { width: auto; }
  .candidate-text {
    flex: 1;
    font-family: var(--mono);
    font-size: 14px;
    word-break: break-all;
    color: var(--accent);
  }
  .copy-btn { margin: 0; padding: 6px 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🔐 Password <span>Manager</span></h1>
      <div class="dbpath">DB: {{ db_path }}</div>
    </div>
    {% block header_actions %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
